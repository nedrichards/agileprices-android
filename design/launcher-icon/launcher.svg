<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="lime" x1="36" y1="24" x2="72" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D1FF16"/>
      <stop offset="1" stop-color="#7CD21B"/>
    </linearGradient>
    <linearGradient id="ink" x1="18" y1="18" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172126"/>
      <stop offset="1" stop-color="#090D10"/>
    </linearGradient>
  </defs>
  <g id="background">
    <path fill="url(#ink)" d="M0,0H108V108H0Z"/>
  </g>
  <g id="foreground">
    <!-- Ring stays circular. Openings give the bolt equal breathing room at both ends. -->
