      d="M50.8,24H61.2Q62.6,24 61.9,25.4L49.2,49.6H59.3Q61,49.6 60.1,51.1L43.3,83.3Q42.5,84.7 42.8,83L47.1,60.4H37.4Q35.8,60.4 36.5,58.9L49.4,25Q49.8,24 50.8,24Z"/>
    <path fill="none" stroke="#FFF5DF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
      d="M65,39V54L75,59"/>
    <path fill="#FFF5DF" d="M67.4,54A2.4,2.4 0 1,1 62.6,54A2.4,2.4 0 1,1 67.4,54Z"/>
  </g>
</svg>
